name: Deploy Astro Site (Contentful)

on:
  repository_dispatch:
    types: [contentful-content-update]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/validate-and-build.yml
    secrets:
      contentful_space_id: ${{ secrets.GATSBY_CONTENTFUL_SPACE_ID }}
      contentful_delivery_token: ${{ secrets.GATSBY_CONTENTFUL_DELIVERY_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
