name: Deploy Astro Site (Contentful)

on:
  repository_dispatch:
    types: [contentful-content-update]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/validate-and-build.yml
    secrets:
      contentful_space_id: ${{ secrets.GATSBY_CONTENTFUL_SPACE_ID }}
      contentful_delivery_token: ${{ secrets.GATSBY_CONTENTFUL_DELIVERY_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
      - name: Deploy validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
